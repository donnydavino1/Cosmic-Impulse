# Publishes the playable game, the phone build and the wiki as a website on every push to main:
#   https://<user>.github.io/<repo>/              start page (Play · Phone · Wiki)
#   https://<user>.github.io/<repo>/stellar-impulse.html  desktop game
#   https://<user>.github.io/<repo>/stellar-impulse-mobile.html
#   https://<user>.github.io/<repo>/wiki.html      wiki (add #es/Home or #zh/Home for a language)
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
